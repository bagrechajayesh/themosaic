# netlify.toml
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Environment variables (set these in Netlify dashboard)
# GITHUB_TOKEN = "your_github_token_here"
# VITE_GITHUB_TOKEN = "your_github_token_here" (fallback)

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Headers for performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form handling (for contact forms)
[[forms]]
  name = "contact"

# Build hooks for auto-deployment when GitHub content changes
# Note: Set up a webhook in your GitHub repo settings:
# Payload URL: https://api.netlify.com/build_hooks/YOUR_BUILD_HOOK_ID
# Content type: application/json
# Events: Push (when _data folder changes)

# Function for webhook validation (optional)
[[functions]]
  external_node_modules = ["@octokit/rest"]