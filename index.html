<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaic - Artist Representation</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <link rel="stylesheet" href="styles.css" /> <!-- Externalized CSS for maintainability -->
</head>
<body>
  <!-- NAVIGATION, HERO, ABOUT, ARTISTS, SERVICES, CONTACT, FOOTER sections remain unchanged structurally -->
  
  <!-- Container-specific IDs and classes are required and referenced by the CMS script -->

  <!-- CMS Script for dynamic content -->
  <script>
    const GITHUB_API_BASE = 'https://api.github.com/repos/bagrechajayesh/themosaic/contents/_data';

    const originalContent = {
      artists: '',
      services: '',
      about: '',
      contact: ''
    };

    const escapeHTML = (str) => {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    };

    const storeOriginalContent = () => {
      originalContent.artists = document.querySelector('.artists-grid')?.innerHTML || '';
      originalContent.services = document.querySelector('.services-grid')?.innerHTML || '';
      originalContent.about = document.querySelector('.about-text')?.innerHTML || '';
      originalContent.contact = document.querySelector('.contact-info')?.innerHTML || '';
    };

    const fetchAndParseJSON = async (url) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
      return res.json();
    };

    const loadCMSListContent = async (type, containerSelector, formatter) => {
      try {
        const response = await fetch(`${GITHUB_API_BASE}/${type}`);
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

        const files = await response.json();
        const jsonFiles = files.filter(file => file.name.endsWith('.json'));
        const responses = await Promise.all(jsonFiles.map(f => fetch(f.download_url)));
        const dataList = await Promise.all(responses.map(res => res.ok ? res.json() : null));

        const container = document.querySelector(containerSelector);
        if (!container) return console.warn(`${type} container not found`);

        const contentHTML = dataList.map((data, i) => data ? formatter(data, jsonFiles[i].name) : '').join('').trim();

        if (contentHTML) {
          container.innerHTML = contentHTML;
          console.log(`CMS ${type} loaded successfully`);
        } else {
          throw new Error(`No valid ${type} content`);
        }
      } catch (error) {
        console.warn(`Failed to load CMS ${type}:`, error.message);
        const container = document.querySelector(containerSelector);
        if (container && originalContent[type] && container.innerHTML.trim() === '') {
          container.innerHTML = originalContent[type];
        }
      }
    };

    const loadCMSAbout = async () => {
      try {
        const data = await fetchAndParseJSON(`${GITHUB_API_BASE}/about.json`);
        const container = document.querySelector('.about-text');
        if (container && data.content) {
          container.innerHTML = escapeHTML(data.content);
          console.log('CMS About loaded');
        } else throw new Error('Missing content');
      } catch (err) {
        console.warn('Failed to load About:', err.message);
        const container = document.querySelector('.about-text');
        if (container && originalContent.about && container.innerHTML.trim() === '') {
          container.innerHTML = originalContent.about;
        }
      }
    };

    const loadCMSContact = async () => {
      try {
        const data = await fetchAndParseJSON(`${GITHUB_API_BASE}/contact.json`);
        const container = document.querySelector('.contact-info');
        if (container && (data.email || data.phone || data.location)) {
          container.innerHTML = `
            <div class="contact-item"><h3>📧 Email</h3><p>${escapeHTML(data.email)}</p></div>
            <div class="contact-item"><h3>📞 Phone</h3><p>${escapeHTML(data.phone)}</p></div>
            <div class="contact-item"><h3>📍 Location</h3><p>${escapeHTML(data.location)}</p></div>
          `;
          console.log('CMS Contact loaded');
        } else throw new Error('Invalid contact data');
      } catch (err) {
        console.warn('Failed to load Contact:', err.message);
        const container = document.querySelector('.contact-info');
        if (container && originalContent.contact && container.innerHTML.trim() === '') {
          container.innerHTML = originalContent.contact;
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      storeOriginalContent();
      setTimeout(() => {
        loadCMSListContent('artists', '.artists-grid', (artist) => `
          <div class="artist-card">
            <div class="artist-avatar">🎨</div>
            <h3>${escapeHTML(artist.title)}</h3>
            <p><strong>${escapeHTML(artist.role)}</strong></p>
            <p>${escapeHTML(artist.description)}</p>
          </div>`);

        loadCMSListContent('services', '.services-grid', (service) => `
          <div class="service-item">
            <div class="service-icon">✨</div>
            <h3>${escapeHTML(service.title)}</h3>
            <p>${escapeHTML(service.description)}</p>
          </div>`);

        loadCMSAbout();
        loadCMSContact();
      }, 300);
    });
  </script>

  <!-- Netlify Identity Redirect -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
